<!DOCTYPE html><html lang="id" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Liliyana (ML)</title>
<style>
*{box-sizing:border-box}html{font-size:16px}

.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;transition:.2s}.sr.cl{cursor:pointer}.sr.cl:hover{background:var(--hv);padding-left:26px}
.sl{animation:sl .35s cubic-bezier(.2,.9,.3,1) both}@keyframes sl{from{opacity:0;transform:translateX(34px)}}
.sw{width:44px;height:24px;border-radius:99px;background:var(--mu);position:relative;transition:.25s;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s cubic-bezier(.3,1.7,.5,1)}.sw.on{background:var(--ac)}.sw.on::after{transform:translateX(20px)}
.cs{width:36px;height:36px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;margin:8px 8px 0 0;color:#fff;transition:.2s}.cs:hover{transform:scale(1.15)}.cs.on::after{content:"✓";font-weight:700}
select{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}input[type=range]{accent-color:var(--ac)}
.mo{position:fixed;inset:0;background:rgba(91,112,131,.45);display:grid;place-items:center;z-index:50;animation:fi .2s}@keyframes fi{from{opacity:0}}
.mc{background:var(--bg);border-radius:16px;width:600px;max-width:96vw;max-height:92vh;overflow:auto;animation:up .35s cubic-bezier(.2,1,.3,1)}@keyframes up{from{opacity:0;transform:translateY(30px) scale(.97)}}
.mh{display:flex;align-items:center;gap:16px;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:2}.mh b{flex:1;font-size:1.2rem}
.cam{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.4);color:#fff;cursor:pointer;border-radius:inherit;transition:.2s}.cam:hover{background:rgba(0,0,0,.55)}
.fm{padding:16px;display:grid;gap:12px}.fm label,.fi{display:block;border:1px solid var(--bd);border-radius:6px;padding:6px 10px;color:var(--mu);font-size:.8rem}.fm label:focus-within,.fi:focus-within{border-color:var(--ac)}.fm input,.fm textarea,.fi input{display:block;width:100%;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:1rem;padding:4px 0;min-height:0}.fi{width:100%}
.ts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:12px 20px;border-radius:10px;z-index:60;animation:in .3s;max-width:90vw;text-align:center}
.rm *{animation:none!important;transition:none!important}
@media(max-width:1100px){aside{display:none}}
@media(max-width:1000px){nav{width:76px;align-items:center}.lb{display:none}.big{width:52px;height:52px;padding:0;font-size:0}.big::after{content:"+";font-size:1.6rem}}

const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v,(a,b)=>a=='s'&&typeof b=='string'&&b.startsWith('blob:')?undefined:b))}catch(e){}};
